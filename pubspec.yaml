name: kinly
description: "Kinly — condividi la posizione con chi conta, solo su invito."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  geolocator: ^13.0.1
  geocoding: ^4.0.0
  battery_plus: ^6.1.1
  maplibre_gl: ^0.26.2
  local_auth: ^3.0.1
  shared_preferences: ^2.5.5
  flutter_compass: ^0.8.1
  http: ^1.6.0
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  sensors_plus: ^6.1.1
  app_links: 6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F4F6FB"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/map/kinly_style.json
