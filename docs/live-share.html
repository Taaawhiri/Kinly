<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Posizione live - Kinly</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --primary: #4A63E7;
    --coral: #FF6B6B;
    --text: #1C2233;
    --text-secondary: #5B6478;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; color: var(--text); }
  #map { position: fixed; inset: 0; background: #F4F6FB; }

  .banner {
    position: fixed; top: 14px; left: 14px; right: 14px; z-index: 1000;
    max-width: 380px;
    background: #FFFFFF;
    border-radius: 16px;
    padding: 12px 16px;
    box-shadow: 0 6px 20px rgba(28, 34, 51, 0.14);
    font-size: 13.5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .banner .logo {
    width: 30px; height: 30px; border-radius: 9px;
    flex: none;
  }
  .banner .text { line-height: 1.4; }
  .banner b { color: var(--primary); }
  .banner .live-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--coral); margin-right: 5px;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .expired { color: #C0392B; font-weight: 600; }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  /* I controlli +/- sono in basso a destra (vedi position: 'bottomright'
     nello script): cosi' non finiscono mai sotto il banner in alto, anche
     su schermi stretti. Qui solo lo stile per farli somigliare all'app. */
  .leaflet-control-zoom { border-radius: 12px !important; overflow: hidden; box-shadow: 0 4px 14px rgba(28,34,51,0.18) !important; border: none !important; }
  .leaflet-control-zoom a { color: var(--primary) !important; }
  .leaflet-control-attribution { border-radius: 8px 0 0 0 !important; font-size: 10.5px !important; }

  /* Marcatore: l'avatar scelto dalla persona (emoji su sfondo sfumato,
     come nell'app) con un alone che pulsa, al posto del pin di default
     di Leaflet. Se non ha scelto un avatar, ripiega sull'iniziale del
     nome col suo colore. */
  .kinly-marker {
    width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid white;
    box-shadow: 0 2px 8px rgba(28,34,51,0.3);
    position: relative;
    display: flex; align-items: center; justify-content: center;
    font-size: 19px;
    color: white;
    font-weight: 700;
  }
  .kinly-marker::after {
    content: '';
    position: absolute; inset: -10px;
    border-radius: 50%;
    background: rgba(74, 99, 231, 0.22);
    animation: ring 2s ease-out infinite;
    z-index: -1;
  }
  @keyframes ring {
    0% { transform: scale(0.6); opacity: 0.8; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  /* Popup della batteria, aperto toccando l'avatar sulla mappa. */
  .leaflet-popup-content-wrapper { border-radius: 14px !important; box-shadow: 0 8px 24px rgba(28,34,51,0.18) !important; }
  .leaflet-popup-content { margin: 12px 14px !important; font-family: system-ui, -apple-system, sans-serif; }
  .battery-row { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
  .battery-row svg { width: 20px; height: 20px; flex: none; }
  .updated-at { font-size: 11.5px; color: var(--text-secondary); margin-top: 4px; }
</style>
</head>
<body>
<div class="banner" id="banner">
  <img class="logo" src="icon.png" alt="">
  <div class="text" id="bannerText">Caricamento...</div>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Stessa tavolozza di avatar a tema dell'app (vedi lib/utils/avatar_catalog.dart):
  // emoji su sfondo sfumato a due colori, scelta dalla persona nel suo profilo.
  var AVATARS = {
    fox:     { emoji: '🦊', colors: ['#FF9A56', '#FF6B35'] },
    cat:     { emoji: '🐱', colors: ['#B388EB', '#8C6FD1'] },
    dog:     { emoji: '🐶', colors: ['#FFC15E', '#FF9F1C'] },
    owl:     { emoji: '🦉', colors: ['#6E7F9E', '#4A5A79'] },
    panda:   { emoji: '🐼', colors: ['#8FA3BF', '#5E7290'] },
    koala:   { emoji: '🐨', colors: ['#9FB4C9', '#71879E'] },
    lion:    { emoji: '🦁', colors: ['#FFC857', '#E8A73B'] },
    rabbit:  { emoji: '🐰', colors: ['#FF9EC4', '#E87DA6'] },
    bear:    { emoji: '🐻', colors: ['#B08968', '#8A6647'] },
    penguin: { emoji: '🐧', colors: ['#5CC8D7', '#3A9CAB'] },
  };

  function markerHtml(name, color, avatarKey) {
    var avatar = AVATARS[avatarKey];
    if (avatar) {
      var bg = 'linear-gradient(135deg,' + avatar.colors[0] + ',' + avatar.colors[1] + ')';
      return '<div class="kinly-marker" style="background:' + bg + '">' + avatar.emoji + '</div>';
    }
    var initial = (name || '?').trim().charAt(0).toUpperCase() || '?';
    return '<div class="kinly-marker" style="background:' + (color || '#4A63E7') + '">' + initial + '</div>';
  }

  function batteryIcon(pct) {
    var color = pct <= 20 ? '#C0392B' : (pct <= 40 ? '#E8A73B' : '#2E9E5B');
    var fillWidth = Math.max(2, Math.round((pct / 100) * 14));
    return '<svg viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="2" y="7" width="17" height="10" rx="2"/>' +
      '<path d="M21 10v4" stroke-width="2.2"/>' +
      '<rect x="4" y="9" width="' + fillWidth + '" height="6" fill="' + color + '" stroke="none"/>' +
      '</svg>';
  }

  function popupHtml(name, batteryPercent, updatedAt) {
    var battery = (batteryPercent == null)
      ? '<div class="battery-row">Batteria non disponibile</div>'
      : '<div class="battery-row">' + batteryIcon(batteryPercent) + '<span>' + batteryPercent + '% di batteria</span></div>';
    var when = '';
    if (updatedAt) {
      try {
        var d = new Date(updatedAt);
        when = '<div class="updated-at">Aggiornato alle ' + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }) + '</div>';
      } catch (_) {}
    }
    return battery + when;
  }

  // Il token arriva dall'URL della pagina stessa (?t=...): questa pagina e'
  // statica e uguale per tutti, e' l'API Supabase sotto a decidere di chi e'
  // la posizione e se il link e' ancora valido.
  var params = new URLSearchParams(location.search);
  var token = params.get('t');
  var apiUrl = 'https://tteqhmlcsgduuzlcqbrt.supabase.co/functions/v1/live-share?t=' + encodeURIComponent(token || '');

  var map = L.map('map', { zoomControl: false }).setView([45.4642, 9.19], 13);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  var marker = null;
  var centered = false;
  var bannerText = document.getElementById('bannerText');

  function refresh() {
    if (!token) {
      bannerText.innerHTML = '<span class="expired">Link non valido.</span>';
      return;
    }
    fetch(apiUrl)
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.expired) {
          bannerText.innerHTML = '<span class="expired">Questo link e\' scaduto.</span>';
          return;
        }
        var name = data.name || 'Qualcuno';
        bannerText.innerHTML = '<span class="live-dot"></span>Posizione live di <b>' + name + '</b>';
        if (data.lat == null) { setTimeout(refresh, 15000); return; }
        var pos = [data.lat, data.lng];
        var icon = L.divIcon({
          className: '',
          html: markerHtml(name, data.color, data.avatar_key),
          iconSize: [40, 40],
          iconAnchor: [20, 20],
          popupAnchor: [0, -18],
        });
        var popup = popupHtml(name, data.battery_percent, data.updated_at);
        if (!marker) {
          marker = L.marker(pos, { icon: icon }).addTo(map).bindPopup(popup);
        } else {
          marker.setLatLng(pos);
          marker.setIcon(icon);
          marker.setPopupContent(popup);
        }
        if (!centered) { map.setView(pos, 15); centered = true; }
        setTimeout(refresh, 15000);
      })
      .catch(function () { setTimeout(refresh, 30000); });
  }
  refresh();
</script>
</body>
</html>
