<!DOCTYPE html>
<html>
<head>
  <!--

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.

  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Condividi la posizione con chi conta, solo su invito.">
  <meta name="theme-color" content="#4A63E7">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kinly">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kinly</title>
  <link rel="manifest" href="manifest.json">

  <!-- Richiesti da maplibre_gl sul web (la mappa nativa Android/iOS non ne
       ha bisogno, per questo mancavano): motore JS di MapLibre GL, versione
       allineata a quella richiesta dal pacchetto maplibre_gl installato. -->
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet"/>

  <!-- Tiene sempre chiusa l'attribuzione OpenStreetMap sulla mappa (sola
       icona "i", cliccabile): MapLibre la apre da solo una volta al primo
       caricamento su schermi stretti, per farla notare, aggiungendo la
       classe maplibregl-compact-show insieme a maplibregl-compact - la
       stessa identica classe usata quando l'utente clicca sull'icona per
       aprirla lui stesso, quindi non si puo' distinguere i due casi solo a
       CSS. Lo script sotto intercetta esclusivamente quella prima apertura
       automatica (il momento in cui maplibregl-compact compare per la
       prima volta) e la richiude subito, poi si disattiva: da li' in poi
       il clic sull'icona apre/chiude normalmente. -->
  <style>
    .maplibregl-ctrl-attrib:not(.maplibregl-compact-show) .maplibregl-ctrl-attrib-inner {
      display: none !important;
    }
    .maplibregl-ctrl-attrib-button {
      display: block !important;
    }
  </style>
  <script>
    (function () {
      var compactSeen = false;
      function check(el) {
        if (compactSeen || !el.classList.contains('maplibregl-compact')) return;
        compactSeen = true;
        if (el.classList.contains('maplibregl-compact-show')) {
          el.classList.remove('maplibregl-compact-show');
          el.removeAttribute('open');
        }
      }
      var observer = new MutationObserver(function (mutations) {
        mutations.forEach(function (m) {
          if (m.target && m.target.classList && m.target.classList.contains('maplibregl-ctrl-attrib')) {
            check(m.target);
          }
        });
      });
      function attach() {
        var el = document.querySelector('.maplibregl-ctrl-attrib');
        if (el) {
          check(el);
          observer.observe(el, { attributes: true, attributeFilter: ['class', 'open'] });
        } else if (!compactSeen) {
          requestAnimationFrame(attach);
        }
      }
      attach();
    })();
  </script>

  <!-- Ponte per il banner "Installa Kinly" (vedi lib/services/pwa_install_service_web.dart):
       cattura qui l'evento beforeinstallprompt, non standard e non tipizzato
       da package:web, ed espone delle funzioni globali semplici che il
       codice Dart può chiamare senza dover manipolare l'evento nativo. -->
  <script>
    (function () {
      var deferredPrompt = null;

      window.kinlyPwaCanInstall = function () {
        return !!deferredPrompt;
      };

      window.kinlyPwaIsStandalone = function () {
        return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      };

      window.kinlyPwaIsIOS = function () {
        var ua = window.navigator.userAgent;
        var isIosUa = /iPad|iPhone|iPod/.test(ua);
        var isIpadOS13 = ua.indexOf('Macintosh') !== -1 && navigator.maxTouchPoints > 1;
        return isIosUa || isIpadOS13;
      };

      window.kinlyPwaPromptInstall = function () {
        if (!deferredPrompt) return Promise.resolve(false);
        var promptEvent = deferredPrompt;
        deferredPrompt = null;
        promptEvent.prompt();
        return promptEvent.userChoice.then(function (choice) {
          window.dispatchEvent(new CustomEvent('kinly-pwa-can-install-changed'));
          return choice.outcome === 'accepted';
        });
      };

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('kinly-pwa-can-install-changed'));
      });

      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        window.dispatchEvent(new CustomEvent('kinly-pwa-can-install-changed'));
      });
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
