plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    // Legge android/app/google-services.json per configurare Firebase
    // (notifiche push): richiesto da firebase_core.
    id "com.google.gms.google-services"
    // Carica i simboli/mapping su Firebase Crashlytics, così i crash
    // arrivano leggibili invece che offuscati.
    id "com.google.firebase.crashlytics"
}

android {
    namespace = "com.kinly.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // Richiesto da flutter_local_notifications (usata per mostrare le
        // notifiche push mentre l'app è in primo piano): senza, la build
        // release fallisce con "requires core library desugaring".
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.kinly.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // local_auth (sblocco biometrico) richiede almeno l'API 24.
        minSdk = Math.max(flutter.minSdkVersion, 24)
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        // Chiave fissa e committata nel repo (android/app/debug.keystore):
        // non è la chiave di un vero store (l'app non va su Play Store), ma
        // deve restare identica ad ogni build, altrimenti Android rifiuta di
        // installare un aggiornamento sopra la versione precedente e va
        // disinstallata a mano ogni volta.
        release {
            storeFile = file("debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

dependencies {
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
}

flutter {
    source = "../.."
}
