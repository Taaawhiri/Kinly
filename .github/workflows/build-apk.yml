name: Build APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: "stable"

      - run: flutter pub get

      - name: Build APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Un --dart-define esplicito (anche vuoto) vince sempre sul
          # defaultValue del codice: se i secret non sono impostati su
          # GitHub, questi flag andrebbero passati vuoti e sovrascriverebbero
          # il progetto Supabase di default incorporato nell'app. Li
          # aggiungiamo quindi solo se i secret sono valorizzati.
          args=()
          if [ -n "$SUPABASE_URL" ]; then
            args+=("--dart-define=SUPABASE_URL=$SUPABASE_URL")
          fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            args+=("--dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")
          fi
          flutter build apk --release "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: kinly-apk
          path: build/app/outputs/flutter-apk/app-release.apk
